name: Release installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (must match package.json, e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-latest
            command: npx electron-builder --win --publish never
          - os: macos
            runner: macos-latest
            command: npx electron-builder --mac --publish never
          - os: linux
            runner: ubuntu-latest
            command: npx electron-builder --linux --publish never

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging tools
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools rpm

      - name: Install dependencies
        run: npm ci

      - name: Point auto-update at this repository
        run: node scripts/ci-set-publish.cjs

      - name: Build renderer/main/preload
        run: npm run build

      - name: Package installers
        run: ${{ matrix.command }}
        env:
          # Optional Windows code signing. Add these repository secrets to sign
          # the installer and remove the "unknown publisher" SmartScreen prompt:
          #   WIN_CSC_LINK          base64 .pfx, file path, or HTTPS URL
          #   WIN_CSC_KEY_PASSWORD  certificate password
          # See docs/CODE_SIGNING.md. Empty secrets are ignored.
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # macOS builds are unsigned by default (free). Add CSC_LINK,
          # CSC_KEY_PASSWORD and Apple notarization secrets to sign them.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Optional free signing for open-source projects via SignPath Foundation.
      # Enable by setting the repository variable SIGNPATH_ENABLED=true and the
      # SIGNPATH_* secrets/variables documented in docs/SIGNPATH_SETUP.md.
      - name: Upload unsigned Windows installer for SignPath
        if: matrix.os == 'windows' && vars.SIGNPATH_ENABLED == 'true'
        id: upload-unsigned-windows
        uses: actions/upload-artifact@v4
        with:
          name: testapi-windows-unsigned
          path: release/TestApi-*-win-x64.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign Windows installer with SignPath
        if: matrix.os == 'windows' && vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-windows

      - name: Install signed Windows installer
        if: matrix.os == 'windows' && vars.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path signed-windows -Filter 'TestApi-*-win-x64.exe' -Recurse | Select-Object -First 1
          if (-not $signed) { throw 'SignPath did not return a signed installer.' }
          $target = Join-Path release $signed.Name
          Copy-Item -LiteralPath $signed.FullName -Destination $target -Force
          node scripts/refresh-windows-update-metadata.cjs $target
          $sig = Get-AuthenticodeSignature -LiteralPath $target
          if ($sig.Status -ne 'Valid') { throw "Signature status is $($sig.Status)" }
          Write-Host "Signed by: $($sig.SignerCertificate.Subject)"

      - name: Show Windows signature status
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature -LiteralPath $_.FullName
            Write-Host "$($_.Name): $($sig.Status)"
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: testapi-${{ matrix.os }}-installers
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: testapi-*-installers
          path: dist
          merge-multiple: true

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: List release files
        run: ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: TestApi ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
